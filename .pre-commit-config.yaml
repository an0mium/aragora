# Pre-commit hooks for Aragora
# See https://pre-commit.com for more information
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|\.md$)
      - id: end-of-file-fixer
        exclude: ^(docs/|\.json$|\.lock$)
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
        exclude: ^(deploy/(helm|multi-region/helm)|aragora-operator/helm)/.*templates/  # Helm templates use Go templating
      - id: check-json
        exclude: ^(package-lock\.json$|node_modules/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^(tests/|aragora/server/middleware/structured_logging\.py)  # Test files and redaction config contain field names

  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^sdk/python/aragora/generated_types\.py$  # Auto-generated, must stay stable

  # Type checking with mypy on the same local surfaces as CI's REQUIRED phase-1
  # typecheck gate. Touched `aragora/**.py` files use CI's changed-file mypy
  # flags; CI force-full trigger files run the full typecheck tier locally.
  # CI remains authoritative because it installs the project and computes the
  # changed-file plan from the PR/branch base.
  #
  # We intentionally do NOT run the manual `mypy_with_baseline.py` helper on
  # pre-push. The required CI workflow uses `scripts/run_typecheck_gate.py` plus
  # `scripts/test_tiers.sh typecheck`; the baseline helper is available only for
  # explicit local baseline filtering or regeneration.
  #
  # This hook runs in an isolated `language: python` env, so pre-commit installs
  # mypy and the same type stubs as CI — the gate never depends on the
  # developer's active environment having mypy (no "No module named mypy"
  # surprises). The changed-file path uses `--follow-imports=skip` /
  # `--ignore-missing-imports` so it does not need the full project installed.
  #
  # Run the full baseline check manually when you want it:
  #   python scripts/ci/mypy_with_baseline.py        # report NEW errors only
  #   python scripts/ci/mypy_with_baseline.py --sync  # regenerate .mypy-baseline
  - repo: local
    hooks:
      - id: typecheck-changed
        name: mypy (changed aragora files or full CI trigger)
        entry: >-
          bash -c 'set -euo pipefail;
          force_full=0;
          for path in "$@"; do
            case "$path" in
              pyproject.toml|.github/workflows/lint.yml|scripts/run_typecheck_gate.py|scripts/test_tiers.sh|requirements*.txt|.github/actions/pr-scope-classifier/*)
                force_full=1
                ;;
            esac
          done;
          if [[ "$force_full" == "1" ]]; then
            bash scripts/test_tiers.sh typecheck;
          else
            mypy --ignore-missing-imports --follow-imports=skip --show-error-codes "$@";
          fi' --
        language: python
        additional_dependencies:
          - mypy
          - types-requests
          - types-redis
          - types-python-dateutil
          - types-setuptools
          - types-jsonschema
          - types-PyYAML
        # pre-commit passes only the changed, still-existing files matching
        # `files:` — either touched aragora Python files or CI force-full
        # trigger files handled by the entrypoint above.
        pass_filenames: true
        files: ^(aragora/.*\.py|pyproject\.toml|\.github/workflows/lint\.yml|scripts/run_typecheck_gate\.py|scripts/test_tiers\.sh|requirements.*\.txt|\.github/actions/pr-scope-classifier/.*)$
        # Run on pre-push to catch type errors before they hit CI.
        stages: [pre-push]

  # Secret detection with gitleaks - also runs at commit-time (not just pre-push)
  # so credentials are caught before they reach history, not just before push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        description: Prevent secrets from being committed
        stages: [pre-commit, pre-push]

  # RBAC coverage check - prevent regression in permission coverage
  - repo: local
    hooks:
      - id: rbac-coverage
        name: Check RBAC decorator coverage
        entry: python scripts/audit_rbac_coverage.py --summary --min-coverage 55
        language: python
        pass_filenames: false
        files: ^aragora/server/handlers/
        stages: [pre-push]

  # Env-mutation audit — block new os.environ writes from concurrent surfaces.
  # Writing to os.environ in a concurrent request or feature path shares config
  # as mutable global state across requests (defect pattern flagged by the
  # Mode 3 panel on #6454, #6447, #6442, #6472). Known intentional mutations
  # are allowlisted in the script with a rationale.
  - repo: local
    hooks:
      - id: env-mutation-audit
        name: Audit os.environ mutation in concurrent surfaces
        entry: python scripts/audit_env_mutation.py
        language: python
        pass_filenames: false
        files: ^aragora/(server/handlers|epistemic)/.*\.py$
        stages: [pre-push]

  # TypeScript type checking for frontend
  - repo: local
    hooks:
      - id: tsc-check
        name: TypeScript type check (frontend)
        entry: bash -c 'cd aragora/live && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^aragora/live/src/.*\.(ts|tsx)$
        stages: [pre-push]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, aragora/]
        additional_dependencies: ["bandit[toml]"]
        # Run on manual stage to avoid slowing down commits
        stages: [manual]

# CI-only configuration
# These checks run in CI but are too slow for every commit
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate
  skip:
    - mypy-baseline  # Run separately in CI for better caching
    - bandit  # Run separately in CI
