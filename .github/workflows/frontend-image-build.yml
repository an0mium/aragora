name: Frontend Image Build

# Builds the frontend container image on every PR that can break it.
#
# Why this exists: `aragora/live/Dockerfile` sat broken on main indefinitely
# because nothing built it — `docker.yml` only builds images on tags/nightly,
# and `deploy-frontend.yml`'s docker job is gated behind a manual dispatch
# input. This job closes that gap by building the image at PR time.
#
# It deliberately does NOT push. Publishing stays with docker.yml and
# deploy-frontend.yml; this is a build-correctness gate only.

on:
  pull_request:
    paths:
      - 'aragora/live/**'
      - 'sdk/typescript/**'
      - 'deploy/Dockerfile.frontend'
      - '.github/workflows/frontend-image-build.yml'
  push:
    branches: [main]
    paths:
      - 'aragora/live/**'
      - 'sdk/typescript/**'
      - 'deploy/Dockerfile.frontend'
      - '.github/workflows/frontend-image-build.yml'
  workflow_dispatch:

concurrency:
  group: frontend-image-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build frontend image
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: aragora
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      # aragora/live/package.json declares "@aragora/sdk": "file:../../sdk/typescript".
      # Any Dockerfile scoped to aragora/live cannot resolve that path, which is the
      # exact failure mode this workflow guards against. Root context is mandatory.
      - name: Assert frontend Dockerfile uses root context
        shell: bash
        run: |
          if [[ ! -f deploy/Dockerfile.frontend ]]; then
            echo "::error::deploy/Dockerfile.frontend is missing"
            exit 1
          fi
          if [[ -f aragora/live/Dockerfile ]]; then
            echo "::error::aragora/live/Dockerfile has reappeared. The frontend image has a"
            echo "::error::single definition at deploy/Dockerfile.frontend, which is built from"
            echo "::error::the repo root so the file: SDK dependency resolves."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          load: true
          tags: aragora/frontend:ci-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.aragora.ai
            NEXT_PUBLIC_WS_URL=wss://api.aragora.ai

      # A green build alone does not prove the image runs: the standalone output is
      # produced by a build script (NEXT_OUTPUT=standalone), so a Dockerfile that
      # builds with the wrong script yields an image whose server.js is absent.
      # Names are run-scoped and no port is published, because the `aragora` runners
      # are shared and a fixed -p 3000:3000 would collide with a concurrent job.
      - name: Smoke test container
        shell: bash
        env:
          IMAGE: aragora/frontend:ci-${{ github.run_id }}
          CONTAINER: frontend-ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker run -d --name "$CONTAINER" "$IMAGE"
          # Assert the image's own HEALTHCHECK reaches "healthy" rather than probing
          # around it. That only succeeds if the server bound to a loopback-reachable
          # address -- a regression a plain "does it build" check cannot see, and one
          # this image shipped with until 2026-07-24.
          health=starting
          for _ in $(seq 1 45); do
            health=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
            if [[ "$health" == "healthy" || "$health" == "unhealthy" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$health" != "healthy" ]]; then
            echo "::error::Frontend container health is '$health' (expected 'healthy')"
            docker inspect -f '{{json .State.Health}}' "$CONTAINER" || true
            docker logs "$CONTAINER" || true
            exit 1
          fi
          echo "Frontend container is healthy."

      - name: Tear down
        if: always()
        shell: bash
        env:
          IMAGE: aragora/frontend:ci-${{ github.run_id }}
          CONTAINER: frontend-ci-${{ github.run_id }}
        run: |
          docker rm -f "$CONTAINER" || true
          docker image rm -f "$IMAGE" || true
