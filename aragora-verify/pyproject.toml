[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aragora-verify"
version = "0.1.2"
description = "Standalone offline verifier for Open Decision Receipts (ODR) -- check schema, JCS canonical digest, Ed25519 signature, and hash-chain linkage with no Aragora install or account."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aragora", email = "team@aragora.dev" },
]
keywords = [
    "decision-receipt",
    "open-decision-receipt",
    "odr",
    "offline-verification",
    "ed25519",
    "jcs",
    "rfc8785",
    "audit-trail",
    "ai-governance",
    "eu-ai-act",
    "decision-integrity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # Floor matches the root project's [tool.uv] constraint-dependencies floor
    # (../pyproject.toml): fixes GHSA-537c-gmf6-5ccf. This package only touches
    # the stable Ed25519 verify + PEM-load surface (hazmat.primitives.
    # asymmetric.ed25519, serialization, exceptions.InvalidSignature), which is
    # unaffected by the 41->48 range.
    # pip-audit risk: a standalone `pip install aragora-verify` resolves this
    # dependency on its own -- it does not inherit the root project's uv-locked
    # constraint-dependencies floor. Before this bump, a solo install could
    # still land on a cryptography release vulnerable to GHSA-537c-gmf6-5ccf;
    # this direct floor is what keeps a standalone install off it.
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
aragora-verify = "aragora_verify.cli:main"

[project.urls]
Homepage = "https://github.com/synaptent/aragora"
Documentation = "https://github.com/synaptent/aragora/blob/main/docs/specs/OPEN_DECISION_RECEIPT.md"
Repository = "https://github.com/synaptent/aragora/tree/main/aragora-verify"
Changelog = "https://github.com/synaptent/aragora/blob/main/aragora-verify/CHANGELOG.md"
"Bug Tracker" = "https://github.com/synaptent/aragora/issues"

[tool.hatch.build.targets.sdist]
# Explicit include list so stray local directories (venvs like .pub/ or .venv/,
# dist/, caches) never get swept into the sdist -- a venv's absolute symlinks
# make `python -m build` fail with tarfile.AbsoluteLinkError.
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "CLAUDE.md",
    "**/CLAUDE.md",
    ".nomic/",
    ".benchmarks/",
    "**/__pycache__",
    "**/.pytest_cache",
    ".pub/",
    ".venv/",
    "dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aragora_verify"]

[tool.hatch.build.targets.wheel.force-include]
"src/aragora_verify/odr_schema.json" = "aragora_verify/odr_schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Previously this package had no [tool.ruff] table at all. Without one,
# Ruff's config discovery skips this file (a pyproject.toml with no
# [tool.ruff] section is ignored) and falls back to the ROOT pyproject.toml,
# whose [tool.ruff.lint.per-file-ignores] "tests/*" entry is relative to the
# repo root and never matches "aragora-verify/tests/*" -- so a direct
# `ruff check aragora-verify/tests` flagged S101 (bare assert) on every test
# file here. Adding this table makes aragora-verify its own Ruff config root,
# so line-length is repeated from the root config (../pyproject.toml
# [tool.ruff]) to keep `ruff format` a no-op here -- Ruff's default
# line-length (88) would otherwise reflow every line between 89-100 chars.
[tool.ruff]
line-length = 100

# Matches the root repo's own "tests/*" = S101 exemption (see
# ../pyproject.toml [tool.ruff.lint.per-file-ignores]).
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
